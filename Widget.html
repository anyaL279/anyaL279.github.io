<body>
   <H1> Welcome the the widget page!</H1> 
   <h2> Select one fortune button</h2>
   <button id="toggleHide">Toggle hidden</button>
   <input id="usernameInput" type="text" name="username" hidden>
   <script>
    let toggleHideButton = document.getElementById("toggleHide");
    let usernameInput = document.getElementById("usernameInput");
    toggleHideButton.addEventListener("click", () => {
        usernameInput.hidden = !usernameInput.hidden;
        toggleHideButton.disabled = true;
        // usernameInput.hidden = true; // hide it
        // usernameInput.hidden = false; // show it
    })
   </script>
</body>
</html>
